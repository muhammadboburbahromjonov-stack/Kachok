<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#BE2A47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kundalik">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ozish kundaligi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: phone-first logbook — sticky day header, one screen per tab, fixed bottom tab bar. Accent = pomegranate (anor), "done" = teal. */
:root{
  --bg:#EFF3F5; --surface:#FFFFFF; --surface-2:#E4EAEE; --ink:#14202A; --muted:#5C6974; --line:#D3DCE2;
  --accent:#BE2A47; --accent-ink:#FFFFFF; --accent-soft:#F6DCE2; --ok:#137A64; --ok-soft:#D3ECE5; --warn:#9A5B00; --warn-soft:#F6E7CC;
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  --plate:#FFFFFF; --egg:#F2C23E; --eggw:#FBF9F2; --oat:#D8B77A; --bowl:#7F9AAE; --chicken:#E0A564; --grill:#9A5726; --beef:#9B3A2D; --fish:#B9C7D3;
  --leaf:#4E9F58; --tomato:#DE4736; --cuke:#B7DC8A; --shaker:#3D6B9A; --whey:#EDE3D1; --water:#62AFE3; --cap1:#E8933A; --cap2:#F3F3F3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#16202A; --surface-2:#1F2B36; --ink:#E5ECF1; --muted:#94A2AE; --line:#2A3845;
  --accent:#F2627D; --accent-ink:#1A0B10; --accent-soft:#3B1D26; --ok:#3CC49F; --ok-soft:#133429; --warn:#E5A84A; --warn-soft:#3A2B12; --plate:#273441; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#16202A; --surface-2:#1F2B36; --ink:#E5ECF1; --muted:#94A2AE; --line:#2A3845;
  --accent:#F2627D; --accent-ink:#1A0B10; --accent-soft:#3B1D26; --ok:#3CC49F; --ok-soft:#133429; --warn:#E5A84A; --warn-soft:#3A2B12; --plate:#273441; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.daytitle{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.15;text-wrap:balance}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:disabled{opacity:.35;cursor:default}
.hcenter{min-width:0;text-align:center}
.sync{font-size:11px;color:var(--muted)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:16px;display:grid;gap:14px}
section[hidden]{display:none}
.stack{display:grid;gap:14px}
h2{font-family:var(--font-display);font-weight:500;font-size:15px;margin:0;letter-spacing:.01em}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

/* today */
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.bignum{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:18px;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:0;background:none;padding:0;display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--muted)}
.wd b{width:100%;aspect-ratio:1;max-width:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:var(--ink);font-weight:600;position:relative;overflow:hidden}
.wd b span{position:relative}
.wd b em{position:absolute;inset:auto 0 0;background:var(--ok-soft);height:var(--p,0%)}
.wd.on b{outline:2px solid var(--accent);outline-offset:1px}
.wd.full b{background:var(--ok);color:var(--surface)}
.wd.full b em{display:none}
.wd.gym b::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.wd.full.gym b::after{background:var(--surface)}
.tools{display:flex;flex-wrap:wrap;gap:8px}

.focus{background:var(--accent-soft);border-color:transparent}
.focus .eyebrow{color:var(--accent)}

.checks{display:grid;gap:0}
.chk{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;border:0;background:none;padding:11px 2px;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:15px;height:15px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.chk[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed="true"] .box svg{opacity:1}
.chk[aria-pressed="true"] .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk .t{font-weight:600;display:block}
.chk .h{font-size:13px;color:var(--muted);display:block}

.water{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.cups{display:flex;flex-wrap:wrap;gap:5px}
.cup{width:16px;height:22px;border-radius:3px 3px 6px 6px;border:2px solid var(--line)}
.cup.f{background:var(--ok);border-color:var(--ok)}
.stepper{display:flex;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;line-height:1}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* weight */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.v.down{color:var(--ok)} .v.up{color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-variant-numeric:tabular-nums;font-size:16px}
.btn{height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 16px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.wide{width:100%}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:300px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.rows{display:grid}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{font-size:14px}
.row .k{font-weight:700;font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px}
.del.arm{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tip{border-color:var(--warn);background:var(--warn-soft)}

/* gym */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;height:40px;border-radius:9px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* pictures */
.fimg{width:72px;height:72px;border-radius:14px;background:var(--surface-2);flex:none}
.fimg svg{width:100%;height:100%;display:block}
/* menu */
.meal{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.meal .tag{font-family:var(--font-display);font-size:12px;color:var(--accent);font-weight:500;letter-spacing:.02em}
.meal:first-child{border-top:0}
.meal .tm{font-family:var(--font-display);font-size:13px;color:var(--accent);font-weight:500;padding-top:2px}
.meal .mm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
ol.plain{margin:0;padding-left:22px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.shop .chk{padding:8px 2px}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sheet */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,15,20,.45);display:grid;align-items:end}
.sheet .panel{background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-width:560px;width:100%;margin:0 auto}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mgrid .chk[aria-pressed="true"] .t{color:var(--ink);text-decoration:none}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .panel{max-height:100dvh;overflow-y:auto}
.sheet .sep{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:360px){.form{grid-template-columns:1fr 1fr}.form .btn{grid-column:1/-1}}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <button class="iconbtn" id="prevDay" aria-label="Oldingi kun"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="hcenter">
      <div class="eyebrow" id="hWeek">1-hafta · 1-kun</div>
      <div class="daytitle" id="hDate">30-oktabr, juma</div>
      <div class="sync" id="sync">Yuklanmoqda…</div>
    </div>
    <button class="iconbtn" id="nextDay" aria-label="Keyingi kun"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="iconbtn" id="openSettings" aria-label="Sozlamalar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="tab-bugun" class="stack"></section>
    <section id="tab-vazn" class="stack" hidden></section>
    <section id="tab-zal" class="stack" hidden></section>
    <section id="tab-menyu" class="stack" hidden></section>
  </div>
</main>

<nav class="tabs" aria-label="Bo'limlar">
  <div class="wrap">
    <button data-tab="bugun" aria-current="page"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Bugun</button>
    <button data-tab="vazn"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>Vazn</button>
    <button data-tab="zal"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Zal</button>
    <button data-tab="menyu"><svg viewBox="0 0 24 24"><path d="M4 3v8a3 3 0 0 0 3 3v7M7 3v6M10 3v8a3 3 0 0 1-3 3"/><path d="M17 21V3c-2 1-3 4-3 8h3"/></svg>Menyu</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Sozlamalar">
    <div class="card-head"><h2>Sozlamalar</h2><button class="del" id="closeSettings">Yopish</button></div>
    <div class="grid2">
      <div class="field"><label for="setStart">Boshlanish sanasi</label><input id="setStart" type="date"></div>
      <div class="field"><label for="setHeight">Bo'y, sm</label><input id="setHeight" type="number" inputmode="decimal" step="1"></div>
      <div class="field"><label for="setStartKg">Boshlang'ich vazn, kg</label><input id="setStartKg" type="number" inputmode="decimal" step="0.1"></div>
      <div class="field"><label for="setGoal">Oylik maqsad, kg</label><input id="setGoal" type="number" inputmode="decimal" step="0.1"></div>
    </div>
    <button class="btn wide" id="saveSettings">Saqlash</button>
    <div class="sep" id="installBox" hidden>
      <h3>Telefonga o'rnatish</h3>
      <p class="small muted" id="installHint"></p>
      <button class="btn ok wide" id="installBtn" hidden>Ilovani o'rnatish</button>
    </div>
    <div class="sep">
      <h3>Zaxira nusxa</h3>
      <p class="small muted" id="storeNote">Ma'lumotlar shu qurilmada saqlanadi. Telefon almashtirishdan oldin zaxira faylini yuklab oling.</p>
      <div class="grid2">
        <button class="btn ghost" id="exportBtn">Yuklab olish</button>
        <button class="btn ghost" id="importBtn">Tiklash</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <p class="small muted" id="backupMsg" role="status"></p>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const KEY="ozish-kundaligi-v1";
const MONTHS=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const WDAYS=["yakshanba","dushanba","seshanba","chorshanba","payshanba","juma","shanba"];
const WSHORT=["Ya","Du","Se","Ch","Pa","Ju","Sh"];

const WEEKS=[
  {steps:6000, focus:"Shirin ichimliklarni to'liq to'xtating va murabbiy menyusiga o'ting.", gym:"2 marta zal: texnikani o'rganing, yengil og'irlik oling.", cardio:15, expect:"−2…−3 kg (asosan suv)"},
  {steps:7000, focus:"Menyuga to'liq amal qiling va salatlarni kattaroq qiling.", gym:"3 marta zal, kunlarini o'zingiz tanlaysiz.", cardio:20, expect:"−0,5…−1 kg"},
  {steps:8000, focus:"Shirinlik faqat rejali: kuniga bitta, tushlikdan keyin.", gym:"3 marta zal, og'irlikni asta oshiring.", cardio:20, expect:"−0,5…−1 kg"},
  {steps:9500, focus:"Hammasini ushlab turing. Osh va somsa haftasiga 1 martadan.", gym:"3 marta zal, kardio 25 daqiqaga.", cardio:25, expect:"−0,5…−1 kg; o'lchov va surat oling"}
];

const SHOP=[
  ["Oqsil",["Tuxum (kuniga 6 ta)","Tovuq ko'kragi yoki son (golen)","Yog'siz mol go'shti","Baliq","Protein: whey izolyat"]],
  ["Nonushta",["Jo'xori yormasi (ovsyanka)","Zaytun yog'i","Kokos yog'i"]],
  ["Salat",["Bodring","Pomidor","Ko'kat (ukrop, petrushka, kashnich)","Karam va sabzi (kletchatka uchun)"]],
  ["Qo'shimchalar",["Arginin","Sink","D3 vitamini","C vitamini","Kardioleks"]]
];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const today=()=>iso(new Date());
const longDate=s=>{const d=parse(s);return d.getDate()+"-"+MONTHS[d.getMonth()]+", "+WDAYS[d.getDay()]};
const shortDate=s=>{const d=parse(s);return d.getDate()+"-"+MONTHS[d.getMonth()].slice(0,3)};
const fmtKg=n=>(Math.round(n*10)/10).toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtInt=n=>n.toLocaleString("ru-RU");

/* ---------- state ---------- */
function blank(){return{v:1,updatedAt:0,settings:{start:"2026-10-30",startKg:130,goalKg:125,heightCm:186},days:{},weights:{},shop:{}}}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.v===1)S=Object.assign(blank(),p)}}catch(e){}
let ref=null, dbTimer=null, syncMode="loading";
let cur=today(), tab="bugun", armedDel=null;
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function day(s){if(!S.days[s])S.days[s]={c:{},w:0};return S.days[s]}
function peekDay(s){return S.days[s]||{c:{},w:0}}
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(ref){setSync("saving");clearTimeout(dbTimer);dbTimer=setTimeout(pushDb,700)}
}

/* ---------- plan helpers ---------- */
function weekNo(s){const d=diff(S.settings.start,s);return d<0?0:Math.floor(d/7)+1}
function weekPlan(s){const w=weekNo(s);return WEEKS[Math.min(Math.max(w,1),4)-1]}
const MUSCLES=[["oyoq","Oyoq"],["yelka","Yelka"],["qanot","Qanot"],["biseps","Qo'l oldi"],["kokrak","Ko'krak"],["triseps","Qo'l orqasi"]];
function isGym(d){return d.gym!=null}
function mgNames(d){return (d.mg||[]).map(k=>(MUSCLES.find(m=>m[0]===k)||[k,k])[1]).join(", ")}
function dayType(s){const d=peekDay(s);if(isGym(d))return "gym";return d.t||"walk"}
function weekStart(s){const w=weekNo(s);return w>0?addDays(S.settings.start,(w-1)*7):addDays(s,-((parse(s).getDay()+6)%7))}
function weekGym(s){const ws=weekStart(s);let n=0;for(let i=0;i<7;i++)if(isGym(peekDay(addDays(ws,i))))n++;return n}
function items(s){
  const w=weekNo(s), p=weekPlan(s), t=dayType(s), mg=mgNames(peekDay(s));
  const list=[
    {id:"drinks",t:"Shirin ichimlik ichmadim",h:"Gazli suv, sharbat, shakarli choy va kofe"},
    {id:"menu",t:"Murabbiy menyusiga amal qildim",h:"Nonushta, tushlik, protein, kechki ovqat va 22:30 kokteyl"},
    {id:"vit",t:"Vitaminlarni ichdim",h:"Sink, D3, C — nonushtadan 30 daqiqa keyin"},
    {id:"steps",t:fmtInt(p.steps)+" qadam yurdim",h:"Telefondagi qadam hisoblagichga qarang"}
  ];
  if(t==="gym")list.push({id:"train",t:"Zalda mashq qildim"+(mg?" ("+esc(mg)+")":""),h:"«Zal» bo'limida nima ishlaganingizni belgilang"});
  if(t==="walk")list.push({id:"train",t:"30–40 daqiqa tez yurdim",h:"Zalsiz kun"});
  list.push(
    {id:"aftermeal",t:"Ovqatdan keyin 10–15 daqiqa yurdim",h:"Ayniqsa tushlik va kechki ovqatdan keyin"},
    {id:"sweet",t:"Shirinlik faqat rejali yoki umuman yo'q",h:"2 xurmo, 20 g qora shokolad yoki 1 meva"},
    {id:"sleep",t:"Kamida 7 soat uxladim",h:"Har kuni bir vaqtda yotish"}
  );
  return list;
}
function scoreOf(s){
  const its=items(s), d=peekDay(s);
  const done=its.filter(i=>d.c[i.id]).length+((d.w||0)>=12?1:0);
  return {done,total:its.length+1};
}
function drinkStreak(){
  let s=today(), n=0;
  if(!peekDay(s).c.drinks)s=addDays(s,-1);
  while(peekDay(s).c.drinks&&s>=S.settings.start){n++;s=addDays(s,-1)}
  return n;
}

function entries(){return Object.keys(S.weights).sort().map(d=>({d,kg:S.weights[d].kg,waist:S.weights[d].waist}))}
function avgAround(list,end,span){const from=addDays(end,-(span-1));const xs=list.filter(e=>e.d>=from&&e.d<=end);return xs.length?{v:xs.reduce((a,e)=>a+e.kg,0)/xs.length,n:xs.length}:null}

/* ---------- render: weight ---------- */
function chartSVG(list){
  const st=S.settings, W=340, H=210, L=36, R=10, T=14, B=26;
  const pts=list.slice();
  if(!S.weights[st.start])pts.unshift({d:st.start,kg:st.startKg,base:true});
  const last=pts.length?pts[pts.length-1].d:st.start;
  const span=Math.max(27,diff(st.start,last)+2);
  const kgs=pts.map(p=>p.kg).concat([st.goalKg]);
  let lo=Math.floor(Math.min(...kgs)-1), hi=Math.ceil(Math.max(...kgs)+0.5);
  if(hi-lo<6)lo=hi-6;
  const step=hi-lo<=8?1:(hi-lo<=16?2:5);
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const x=s=>L+(W-L-R)*diff(st.start,s)/span;
  const y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let g="";
  for(let v=lo;v<=hi;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`}
  for(let k=0;k*7<=span;k++){const s=addDays(st.start,k*7);g+=`<text x="${x(s)}" y="${H-8}" text-anchor="${k===0?"start":"middle"}" font-size="10" fill="var(--muted)">${k===0?"Start":k+"-h"}</text>`}
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(st.goalKg)}" y2="${y(st.goalKg)}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(st.goalKg)-5}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ok)">Maqsad ${fmtKg(st.goalKg)}</text>`;
  const avg=pts.map(p=>{const a=avgAround(pts,p.d,7);return {d:p.d,v:a.v}});
  if(avg.length>1)g+=`<polyline points="${avg.map(a=>x(a.d).toFixed(1)+","+y(a.v).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  g+=pts.map(p=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3" fill="var(--surface)" stroke="${p.base?"var(--muted)":"var(--accent)"}" stroke-width="1.5"/>`).join("");
  const lp=pts[pts.length-1];
  g+=`<circle cx="${x(lp.d).toFixed(1)}" cy="${y(lp.kg).toFixed(1)}" r="5" fill="var(--accent)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vazn grafigi"><rect width="${W}" height="${H}" fill="none"/>${g}</svg>`;
}

    <div class="card">
      <div class="meal" style="border-top:0;padding-top:0">${foodArt("water")}<div style="display:grid;gap:3px"><span class="tag">Suv</span><b>Kuniga kamida 3, ko'pi bilan 5 litr</b><span class="small muted">«Bugun» bo'limida stakanlab hisoblang.</span></div></div>
      <div class="meal">${foodArt("vit")}<div style="display:grid;gap:3px"><span class="tag">Vitaminlar</span><b>Sink, D3 (10 000 birlik), C vitamini</b><span class="small">Nonushtadan yarim soat keyin. Yotishdan oldin Kardioleks, 1 dona.</span><span class="small muted">D vitaminingiz tahlilda normada (34,2). 10 000 birlikni qancha muddat ichishni endokrinolog bilan aniqlang.</span></div></div>
    </div>
    <div class="card">
      <h3>Qo'shimcha maslahatlar</h3>
      <ul class="plain">
        <li>Salatni kattaroq qiling: karam va sabzi qo'shing. Menyuda kletchatka kam.</li>
        <li>Zalda holsizlik yoki bosh aylanishi sezsangiz, mashq kunlari tushlikka 100–150 g grechka qo'shing.</li>
        <li>Non, shirinlik va shirin ichimliklar menyuda yo'q, shunday qolsin.</li>
        <li>Ovqatdan keyin 10–15 daqiqa yuring.</li>
      </ul>
    </div>
    <div class="card">
      <h3>Shirinlik istagi kelsa</h3>
      <ul class="plain">
        <li>Uyda saqlamang.</li>
        <li>Suv yoki shakarsiz choy iching va 10 daqiqa kuting. Ko'pincha istak o'tib ketadi.</li>
        <li>Juda qiynalsangiz, 2 xurmo yoki 1 olma, tushlikdan keyin.</li>
        <li>Xato qilsangiz, keyingi ovqatdan rejaga qayting.</li>
      </ul>
    </div>
    <div class="card shop">
      <div class="card-head"><h3>Xarid ro'yxati</h3><button class="del" id="shopReset">Belgilarni tozalash</button></div>
      ${shop}
    </div>
    <div class="card">
      <h3>Shifokor nazorati</h3>
      <ul class="plain">
        <li>Menyu va vitaminlarni endokrinologga ko'rsating: insulin va C-peptid yuqori, AST biroz baland.</li>
        <li>3 oydan keyin qayta tahlil: insulin, C-peptid, glyukoza, HbA1c, ALT, AST, lipid spektr, D vitamini va jigar UZI.</li>
        <li><b>Mashqni darhol to'xtating</b>: ko'krakda og'riq yoki siqilish, kuchli bosh aylanishi, nafas yetishmasligi, yurak notekis urishi.</li>
      </ul>
    </div>
  `;
}

/* ---------- render all ---------- */
function render(){
  renderHeader();
  ({bugun:renderToday,vazn:renderWeight,zal:renderGym,menyu:renderMenu})[tab]();
}
function showTab(t){
  tab=t;
  document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!=="tab-"+t);
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  render();
  try{localStorage.setItem(KEY+"-tab",t)}catch(e){}
  window.scrollTo({top:0});
}

/* ---------- events ---------- */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)showTab(b.dataset.tab)});
document.getElementById("prevDay").addEventListener("click",()=>{cur=addDays(cur,-1);armedDel=null;render()});
document.getElementById("nextDay").addEventListener("click",()=>{if(cur<today()){cur=addDays(cur,1);armedDel=null;render()}});

document.querySelector("main").addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");
  if(go){cur=go.dataset.go;render();return}
  const c=e.target.closest("[data-chk]");
  if(c){const d=day(cur);d.c[c.dataset.chk]=!d.c[c.dataset.chk];save();render();return}
  const wb=e.target.closest("[data-water]");
  if(wb){const d=day(cur);d.w=Math.max(0,Math.min(20,(d.w||0)+Number(wb.dataset.water)));save();render();return}
  const del=e.target.closest("[data-del]");
  if(del){const k=del.dataset.del;if(armedDel===k){delete S.weights[k];armedDel=null;save()}else armedDel=k;render();return}
  const dt=e.target.closest("[data-dtype]");
  if(dt){const d=day(cur),v=dt.dataset.dtype;if(v!=="gym"&&isGym(d)){delete d.gym;delete d.mg}if(dayType(cur)!==v)d.c.train=false;d.t=v;save();render();return}
  const mb=e.target.closest("[data-mg]");
  if(mb){const d=day(cur),k=mb.dataset.mg,a=(d.mg||[]).filter(x=>x!==k);if(a.length===(d.mg||[]).length)a.push(k);
    if(a.length){d.mg=a;d.gym=0;d.t="gym";d.c.train=true}else{delete d.mg;delete d.gym;d.c.train=false}
    save();render();return}
  const sh=e.target.closest("[data-shop]");
  if(sh){S.shop[sh.dataset.shop]=!S.shop[sh.dataset.shop];save();render();return}
  if(e.target.closest("#shopReset")){S.shop={};save();render();return}
});
/* settings */
const sheet=document.getElementById("sheet");
document.getElementById("openSettings").addEventListener("click",()=>{
  const s=S.settings;
  document.getElementById("setStart").value=s.start;
  document.getElementById("setHeight").value=s.heightCm;
  document.getElementById("setStartKg").value=s.startKg;
  document.getElementById("setGoal").value=s.goalKg;
  document.getElementById("storeNote").textContent=ref?"Ma'lumotlar hisobingizga saqlanadi. Xohlasangiz, zaxira faylini ham yuklab oling.":"Ma'lumotlar shu qurilmada saqlanadi. Telefon almashtirishdan oldin zaxira faylini yuklab oling.";
  document.getElementById("backupMsg").textContent="";
  updateInstall();
  sheet.hidden=false;
});
document.getElementById("closeSettings").addEventListener("click",()=>sheet.hidden=true);
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.hidden=true});
document.getElementById("saveSettings").addEventListener("click",()=>{
  const s=S.settings, num=id=>parseFloat(document.getElementById(id).value.replace(",","."));
  const st=document.getElementById("setStart").value;
  if(/^\d{4}-\d{2}-\d{2}$/.test(st))s.start=st;
  const h=num("setHeight"),a=num("setStartKg"),g=num("setGoal");
  if(h>=120&&h<=230)s.heightCm=h;
  if(a>=40&&a<=250)s.startKg=a;
  if(g>=40&&g<=250)s.goalKg=g;
  save();sheet.hidden=true;render();
});

/* backup */
document.getElementById("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="kundalik-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  document.getElementById("backupMsg").textContent="Zaxira fayli yuklab olindi.";
});
const importFile=document.getElementById("importFile");
document.getElementById("importBtn").addEventListener("click",()=>{importFile.value="";importFile.click()});
importFile.addEventListener("change",async()=>{
  const f=importFile.files&&importFile.files[0], msg=document.getElementById("backupMsg");
  if(!f)return;
  let d=null;try{d=JSON.parse(await f.text())}catch(e){}
  if(!d||d.v!==1||typeof d.days!=="object"){msg.textContent="Bu fayl kundalik zaxirasi emas.";return}
  if(!confirm("Hozirgi ma'lumotlar zaxiradagisi bilan almashtirilsinmi?"))return;
  S=Object.assign(blank(),d);save();render();
  msg.textContent="Ma'lumotlar tiklandi.";
});

/* install (PWA) */
let installEvt=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function updateInstall(){
  const box=document.getElementById("installBox"), btn=document.getElementById("installBtn"), hint=document.getElementById("installHint");
  if(standalone()||!("serviceWorker" in navigator)){box.hidden=true;return}
  box.hidden=false;btn.hidden=!installEvt;
  hint.textContent=installEvt?"Kundalikni bosh ekranga qo'shing: internet bo'lmasa ham ishlaydi."
    :isIOS?"Safari'da «Ulashish» tugmasini bosing, so'ng «Bosh ekranga qo'shish»ni tanlang."
    :"Brauzer menyusidan «Bosh ekranga qo'shish» yoki «Ilovani o'rnatish»ni tanlang.";
}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;updateInstall()});
addEventListener("appinstalled",()=>{installEvt=null;updateInstall()});
document.getElementById("installBtn").addEventListener("click",async()=>{
  if(!installEvt)return;
  installEvt.prompt();try{await installEvt.userChoice}catch(e){}
  installEvt=null;updateInstall();
});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- boot ---------- */
try{const t=localStorage.getItem(KEY+"-tab");if(t&&["bugun","vazn","zal","menyu"].includes(t))tab=t}catch(e){}
showTab(tab);
setSync("local");

(async()=>{
  try{
    if(!window.claude||!window.claude.use){setSync("local");return}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){setSync("local");return}
    const uid=await user.id();
    if(!uid){setSync("local");return}
    ref=db.collection("data/users/"+uid).doc("tracker");
    const snap=await ref.get();
    if(snap.exists){
      const body=snap.data()||{};
      let remote=null;try{remote=JSON.parse(body.json)}catch(e){}
      if(remote&&remote.v===1&&(remote.updatedAt||0)>(S.updatedAt||0)){
        S=Object.assign(blank(),remote);
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        render();setSync("saved");
      }else if(S.updatedAt>0){await pushDb()}
      else setSync("saved");
    }else{
      if(S.updatedAt>0)await pushDb();
      setSync("saved");
    }
  }catch(e){ref=null;setSync("local")}
})();
})();
</script>
