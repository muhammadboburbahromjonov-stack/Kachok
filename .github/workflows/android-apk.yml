name: Android APK

# Builds the diary as an Android app (WebView around index.html) and publishes the APK
# as the "apk" release, so the newest build is always at Releases -> Kundalik.apk.
on:
  push:
    paths:
      - index.html
      - android/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Put the page into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Kundalik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kundalik-apk
          path: Kundalik.apk

      - name: Publish as the "apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Kundalik.apk \
            --target "${{ github.sha }}" \
            --title "Kundalik APK (build ${{ github.run_number }})" \
            --notes "Telefonga o'rnatish uchun Kundalik.apk faylini yuklab oling. Commit: ${{ github.sha }}" \
            --prerelease
